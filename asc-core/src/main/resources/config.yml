# ==============================================================================
#            ADAPTIVE SERVER CORE (ASC) — CONFIGURATION FILE
#      Enterprise-Grade Real-Time Performance & Adaptive Load Engine
# ==============================================================================

# General settings
core:
  debug: false
  metrics-sample-rate-seconds: 1

# ------------------------------------------------------------------------------
# 2.1 DYNAMIC & ADAPTIVE MOB CAP SYSTEM (Load-Budget Model)
# ------------------------------------------------------------------------------
mobcap:
  # Enable or disable the dynamic mob cap module
  enabled: true

  # Target performance thresholds
  target-mspt: 40.0
  target-tps: 20.0

  # Cap bonus multiplier under low player count or idle server load (1.0 = 100%, 1.5 = 150%)
  max-bonus-multiplier: 1.5

  # Minimum floor multiplier during peak stress (0.25 = caps will not drop below 25% of base)
  min-floor-multiplier: 0.25

  # Automatic distant inactive entity despawn sweep (only activates under heavy load)
  despawn-sweep:
    enabled: true
    interval-seconds: 10
    radius-blocks: 72
    max-per-sweep: 50

# ------------------------------------------------------------------------------
# 2.2 REDSTONE AND HOPPER WATCHDOG (Anti-Lag-Machine)
# ------------------------------------------------------------------------------
redstone-watchdog:
  enabled: true

  # Update threshold in a single localized volume (3x3x3) per second
  # If exceeded, the mechanism is tagged as an oscillating loop and throttled
  frequency-threshold: 16

  # Hopper item transfer rate limit (maximum transfers per second per chunk)
  hopper-transfer-limit: 50

  # Whitelist / Technical zones (throttling is bypassed in these chunks)
  whitelisted-chunks: []

# ------------------------------------------------------------------------------
# 2.3 ELYTRA AND CHUNK GENERATION CONTROLLER
# ------------------------------------------------------------------------------
chunk-throttle:
  enabled: true

  # Predictive asynchronous pre-generation along fast-flying player trajectories
  predictive-pregen: true

  # Dynamic view and simulation distance adaptation based on server MSPT load
  dynamic-view-distance:
    enabled: true
    min-distance: 6
    max-distance: 12
    step-interval-seconds: 10

# ------------------------------------------------------------------------------
# 2.4 CHUNK HIBERNATION & "LAZY SIMULATION" ENGINE
# ------------------------------------------------------------------------------
lazysim:
  enabled: true

  # Maximum catch-up simulation duration cap (in hours, 168 = 7 days)
  max-catchup-hours: 168

  # Subsystems simulated via mathematical delta upon chunk reawakening
  processors:
    furnaces: true     # Smelting progress and fuel consumption without overflow
    crops: true        # Deterministic crop growth based on moisture and light
    villagers: true    # Villager trading restocks based on Minecraft day cycles
    animals: true      # Baby animal maturation and breeding cooldown reset
    beehives: true     # Beehive and bee nest honey level accumulation

# ------------------------------------------------------------------------------
# 3. COMPATIBILITY AND INTEGRATIONS (Compatibility Shims)
# ------------------------------------------------------------------------------
compatibility:
  auto-detect-anti-lag: true
  worldguard-integration: true
  chunky-integration: true
  mythicmobs-protection: true
  placeholderapi-expansion: true
